# Automated dependency update PRs for AETHER Core packages.
# https://docs.github.com/en/code-security/dependabot

version: 2
updates:
  - package-ecosystem: npm
    directory: /aether-core/frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
        patterns:
          - '@*/*'
          - 'eslint*'
          - 'vitest*'
          - 'playwright*'
          - 'prettier'
    ignore:
      # Keep size-limit + @size-limit/file on the same major (peer dep).
      - dependency-name: 'size-limit'
        update-types: ['version-update:semver-major']
      - dependency-name: '@size-limit/file'
        update-types: ['version-update:semver-major']
      # Vite 8+ needs coordinated plugin/tooling upgrades.
      - dependency-name: 'vite'
        update-types: ['version-update:semver-major']

  - package-ecosystem: npm
    directory: /aether-core/backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # Prisma 7 requires schema/config migration (prisma.config.ts).
      - dependency-name: 'prisma'
        update-types: ['version-update:semver-major']
      - dependency-name: '@prisma/client'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
