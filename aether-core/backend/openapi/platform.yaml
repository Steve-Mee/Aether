        '401':
          description: Unauthorized
  '/emails/{id}/rollback':
    post:
      tags:
        - Emails
      summary: 'POST /emails/{id}/rollback'
      operationId: post_emails_id_rollback
      responses:
        '200':
          description: OK
        '400':
          description: Bad request
        '401':
          description: Unauthorized
  /suppliers/changes:
    get:
      tags:
        - Suppliers
      summary: GET /suppliers/changes
      operationId: get_suppliers_changes
      responses:
        '200':
          description: OK
        '400':
