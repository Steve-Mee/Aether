components:
  schemas:
    EmailMessage:
      type: object
      required:
        - id
        - from
        - subject
        - body
        - status
        - riskLevel
        - createdAt
      properties:
        id:
          type: string
        from:
          type: string
        subject:
          type: string
        body:
          type: string
        status:
          type: string
        riskLevel:
          type: string
        createdAt:
          type: string
          format: date-time
        approvalId:
          type: string
        contextSource:
          type: string
        autoSent:
          type: boolean
    ProcessEmailRequest:
      type: object
      required:
        - from
      properties:
        from:
          type: string
          format: email
        subject:
          type: string
        body:
          type: string
        messageId:
          type: string
    EmailMetrics:
      type: object
      required:
        - status
        - classificationSourceNote
        - totalProcessed
        - classifiedCount
        - classificationRate
        - escalatedCount
        - escalationRate
        - autoRepliedCount
        - pilotProcessedCount
        - autoReplyRate
        - rollbackCount
        - rollbackRate
        - classificationSource
        - targetsMet
      properties:
        status:
          type: string
          enum:
            - partial
        classificationSourceNote:
          type: string
        totalProcessed:
          type: integer
        classifiedCount:
          type: integer
        classificationRate:
          type: number
        escalatedCount:
          type: integer
        escalationRate:
          type: number
        autoRepliedCount:
          type: integer
        pilotProcessedCount:
          type: integer
        autoReplyRate:
          type: number
        rollbackCount:
          type: integer
        rollbackRate:
          type: number
        classificationSource:
          type: object
          properties:
            ollama:
              type: integer
            heuristic:
              type: integer
        targetsMet:
          type: object
          properties:
            classificationAbove60Pct:
              type: boolean
            escalationBelow15Pct:
              type: boolean
            autoReplyAbove70Pct:
              type: boolean
    BilateralSchema:
      type: object
      required:
        - id
        - schemaKey
        - fields
        - description
      properties:
        id:
          type: string
        schemaKey:
          type: string
        fields:
          type: array
          items:
            type: string
        description:
          type: string
    BilateralContract:
      type: object
      required:
        - id
        - status
        - role
        - providerTenantId
        - consumerTenantId
        - partnerTenantId
        - partnerName
        - partnerSlug
        - schemaKey
        - schemaDescription
        - allowedFields
        - allowedFieldCount
        - ttlExpiresAt
        - consentProviderAt
        - consentConsumerAt
        - consentComplete
        - revokedAt
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        status:
          type: string
        role:
          type: string
          enum:
            - provider
            - consumer
        providerTenantId:
          type: string
        consumerTenantId:
          type: string
        partnerTenantId:
          type: string
        partnerName:
          type: string
        partnerSlug:
          type: string
        schemaKey:
          type: string
        schemaDescription:
          type: string
        allowedFields:
          type: array
          items:
            type: string
        allowedFieldCount:
          type: integer
        ttlExpiresAt:
          type: string
          format: date-time
          nullable: true
        consentProviderAt:
          type: string
          format: date-time
          nullable: true
        consentConsumerAt:
          type: string
          format: date-time
          nullable: true
        consentComplete:
          type: boolean
        revokedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ProposeContractRequest:
      type: object
      required:
        - schemaKey
        - allowedFields
      properties:
        consumerTenantId:
          type: string
        consumerTenantSlug:
          type: string
        schemaKey:
          type: string
        allowedFields:
          type: array
          items:
            type: string
          minItems: 1
        ttlExpiresAt:
          type: string
          format: date-time
    BilateralPackage:
      type: object
      required:
        - id
        - packageHash
        - expiresAt
        - createdAt
        - fieldCount
        - expired
      properties:
        id:
          type: string
        packageHash:
          type: string
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        fieldCount:
          type: integer
        expired:
          type: boolean
    BilateralAuditDto:
      type: object
      required:
        - id
        - action
        - fieldHash
        - recordCount
        - createdAt
      properties:
        id:
          type: string
        action:
          type: string
        fieldHash:
          type: string
        recordCount:
          type: integer
        createdAt:
          type: string
          format: date-time
    ApprovalRecord:
      type: object
      required:
        - id
        - tenantId
        - module
        - actionType
        - payload
        - status
        - requestedBy
        - resolvedBy
        - createdAt
        - resolvedAt
      properties:
        id:
          type: string
        tenantId:
          type: string
        module:
          type: string
        actionType:
          type: string
        payload:
          type: object
          additionalProperties: true
        status:
          type: string
        requestedBy:
          type: string
          nullable: true
        resolvedBy:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        resolvedAt:
          type: string
          format: date-time
          nullable: true
    ResolveApprovalRequest:
      type: object
      required:
        - approve
      properties:
        approve:
          type: boolean
    SupplierListItem:
      type: object
      required:
        - id
        - name
        - website
        - status
        - autoSyncEnabled
        - supplierType
        - createdAt
      properties:
        id:
          type: string
        name:
          type: string
        website:
          type: string
