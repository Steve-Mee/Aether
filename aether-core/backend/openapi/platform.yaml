  '/suppliers/{id}':
    get:
      tags:
        - Suppliers
      summary: 'GET /suppliers/{id}'
      operationId: get_suppliers_id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierDetail'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '404':
          description: Not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
    patch:
      tags:
        - Suppliers
      summary: 'PATCH /suppliers/{id}'
      operationId: patch_suppliers_id
      responses:
        '200':
          description: OK
        '400':
          description: Bad request
        '401':
          description: Unauthorized
  /auth/refresh:
    post:
      tags:
