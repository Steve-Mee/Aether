  /approvals/auto-apply:
    post:
      tags:
        - Approvals
      summary: POST /approvals/auto-apply
      operationId: post_approvals_auto_apply
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - applied
                  - skipped
                  - skippedIds
                properties:
                  applied:
                    type: integer
                  skipped:
                    type: integer
                  skippedIds:
                    type: array
                    items:
                      type: string
        '400':
          description: Bad request
        '401':
          description: Unauthorized
  '/autonomous/decision/{id}':
    get:
      tags:
        - Autonomous
      summary: 'GET /autonomous/decision/{id}'
      operationId: get_autonomous_decision_id
      responses:
        '200':
          description: OK
        '400':
          description: Bad request
        '401':
          description: Unauthorized
  '/bilateral/contracts/{id}':
    get:
      tags:
