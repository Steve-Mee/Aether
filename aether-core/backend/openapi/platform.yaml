  /bilateral/packages/consume:
    post:
      tags:
        - Bilateral
      summary: POST /bilateral/packages/consume
      operationId: post_bilateral_packages_consume
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - packageId
                  - fields
                properties:
                  packageId:
                    type: string
                  fields:
                    type: array
                    items:
                      type: string
        '400':
          description: Bad request
        '401':
          description: Unauthorized
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - packageId
              properties:
                packageId:
                  type: string
  /outcomes/billing/reconcile:
    post:
      tags:
