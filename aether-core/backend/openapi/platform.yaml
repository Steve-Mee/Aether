  /emails/metrics:
    get:
      tags:
        - Emails
      summary: GET /emails/metrics
      operationId: get_emails_metrics
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailMetrics'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
      parameters:
        - name: days
          in: query
          schema:
            type: integer
            default: 30
  /emails/process:
    post:
      tags:
        - Emails
      summary: POST /emails/process
      operationId: post_emails_process
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailMessage'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '401':
          description: Unauthorized
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessEmailRequest'
  /outcomes/record:
    post:
      tags:
        - Outcomes
      summary: POST /outcomes/record
      operationId: post_outcomes_record
      responses:
        '200':
          description: OK
        '400':
