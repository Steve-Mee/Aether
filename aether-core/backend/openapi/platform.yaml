  /bilateral/contracts:
    get:
      tags:
        - Bilateral
      summary: GET /bilateral/contracts
      operationId: get_bilateral_contracts
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - contracts
                properties:
                  contracts:
                    type: array
                    items:
                      $ref: '#/components/schemas/BilateralContract'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
    post:
      tags:
        - Bilateral
      summary: POST /bilateral/contracts
      operationId: post_bilateral_contracts
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BilateralContract'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProposeContractRequest'
  '/suppliers/{id}/monitor':
    post:
      tags:
