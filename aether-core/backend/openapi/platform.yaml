openapi: 3.0.3
info:
  title: AETHER Platform API
  description: |-
    Always-on platform REST under `/api/*` (auth + tenant required except auth login/refresh).
    Wave 18: enriched bilateral, emails, suppliers, approvals; other mounts remain thin.
    Excluded (feature-gated experimental): predictive, self-evolving, agentic, physical, co-ownership.
  version: 0.1.0
servers:
  - url: /api
    description: Authenticated platform API
tags:
  - name: Approvals
  - name: Auth
  - name: Autonomous
  - name: Bilateral
  - name: Emails
  - name: HiveMind
  - name: Media
  - name: Outcomes
  - name: Plugins
  - name: Suppliers
paths:
  /emails:
    get:
      tags:
        - Emails
      summary: GET /emails
      operationId: get_emails
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EmailMessage'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
  /plugins:
    get:
      tags:
        - Plugins
      summary: GET /plugins
      operationId: get_plugins
      responses:
        '200':
          description: OK
        '400':
          description: Bad request
        '401':
          description: Unauthorized
    post:
      tags:
        - Plugins
      summary: POST /plugins
      operationId: post_plugins
      responses:
        '200':
          description: OK
        '400':
          description: Bad request
        '401':
          description: Unauthorized
  '/emails/{id}':
    get:
      tags:
        - Emails
      summary: 'GET /emails/{id}'
      operationId: get_emails_id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailMessage'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '404':
          description: Not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /outcomes:
    get:
      tags:
        - Outcomes
      summary: GET /outcomes
      operationId: get_outcomes
      responses:
        '200':
          description: OK
        '400':
          description: Bad request
        '401':
          description: Unauthorized
  /approvals:
    get:
      tags:
        - Approvals
      summary: GET /approvals
      operationId: get_approvals
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApprovalRecord'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
  '/media/{mediaTenantId}/{fileName}':
    get:
      tags:
        - Media
      summary: 'GET /media/{mediaTenantId}/{fileName}'
      operationId: get_media_mediaTenantId_fileName
      responses:
        '200':
          description: OK
        '400':
          description: Bad request
        '401':
          description: Unauthorized
  /suppliers:
    get:
      tags:
        - Suppliers
      summary: GET /suppliers
      operationId: get_suppliers
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SupplierListItem'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
    post:
      tags:
        - Suppliers
      summary: POST /suppliers
      operationId: post_suppliers
      responses:
        '200':
          description: OK
        '400':
          description: Bad request
        '401':
          description: Unauthorized
  /auth/login:
    post:
      tags:
        - Auth
      summary: POST /auth/login
      operationId: post_auth_login
      responses:
        '200':
          description: OK
        '400':
