      summary: GET /emails/mailboxes
      operationId: get_emails_mailboxes
      responses:
        '200':
          description: OK
        '400':
          description: Bad request
        '401':
          description: Unauthorized
    post:
      tags:
        - Emails
      summary: POST /emails/mailboxes
      operationId: post_emails_mailboxes
      responses:
        '200':
          description: OK
        '400':
