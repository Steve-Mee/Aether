        '401':
          description: Unauthorized
  /command:
    post:
      tags:
        - Command
      summary: POST /command
      operationId: post_command
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandOutcome'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecuteCommandRequest'
  /explain:
    get:
      tags:
        - Explain
      summary: GET /explain
