openapi: 3.0.3
info:
  title: AETHER Admin Command Bar API
  description: |-
    Admin API under `/api/admin/*` (auth + tenant required).
    Wave 18: includes `/bilateral/audit` and enriched command/overview schemas.
  version: 0.1.0
servers:
  - url: /api/admin
    description: Authenticated admin command-bar API
tags:
  - name: Activity
  - name: Agents
  - name: Autonomy
  - name: Bilateral
  - name: Brain
  - name: Command
  - name: Commands
  - name: ConnectedServices
  - name: Dashboard
  - name: Events
  - name: Explain
  - name: Federated
  - name: Goals
  - name: Notifications
  - name: Observability
  - name: OperatingMetrics
  - name: Overview
  - name: Policies
  - name: ProactiveSuggestions
  - name: Settings
  - name: Suggestions
  - name: Truth
  - name: UiEvent
  - name: Workflows
paths:
  /goals:
    get:
      tags:
        - Goals
      summary: GET /goals
      operationId: get_goals
      responses:
        '200':
          description: OK
        '400':
          description: Bad request
        '401':
          description: Unauthorized
    post:
      tags:
        - Goals
      summary: POST /goals
      operationId: post_goals
      responses:
        '200':
          description: OK
        '400':
          description: Bad request
        '401':
          description: Unauthorized
  /agents:
