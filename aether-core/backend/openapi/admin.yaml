components:
  schemas:
    ExecuteCommandRequest:
      type: object
      required:
        - command
      properties:
        command:
          type: string
          minLength: 1
          maxLength: 2000
    CommandOutcome:
      type: object
      required:
        - success
        - originalCommand
        - parsedIntent
        - action
        - result
        - confidence
        - timestamp
        - commandId
        - undoable
      properties:
        success:
          type: boolean
        originalCommand:
          type: string
        parsedIntent:
          type: string
        action:
          type: string
        result: {}
        confidence:
          type: number
        verifiedUplift: {}
        timestamp:
          type: string
          format: date-time
        commandId:
          type: string
        undoable:
          type: boolean
        undoExpiresAt:
          type: string
          format: date-time
        requiresApproval:
          type: boolean
        riskBand:
          type: string
          enum:
            - low
            - medium
            - high
        brain:
          type: object
          additionalProperties: true
          properties:
            specialist:
              type: string
            agents:
              type: array
              items:
                type: string
            executionMode:
              type: string
            handoffChain:
              type: array
              items: {}
            agentContributions: {}
            actionConflicts: {}
            synthesisSource:
              type: string
      additionalProperties: true
    OverviewFeedItem:
      type: object
      required:
        - kind
        - at
        - id
        - cursor
        - payload
      properties:
        kind:
          type: string
          enum:
            - activity
            - proactive
            - approval
            - goal_snapshot
            - goal_completed
            - agent_handoff
        at:
          type: string
          format: date-time
        id:
          type: string
        cursor:
          type: string
        payload:
          type: object
          additionalProperties: true
    OverviewFeedResponse:
      type: object
      required:
        - items
        - nextCursor
        - hasMore
        - meta
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OverviewFeedItem'
        nextCursor:
          type: string
          nullable: true
        hasMore:
          type: boolean
        meta:
          type: object
          required:
            - pendingApprovals
            - proactiveCount
            - activeGoals
          properties:
            pendingApprovals:
              type: integer
            proactiveCount:
              type: integer
            activeGoals:
              type: integer
    BilateralAdminAuditRecord:
      type: object
      required:
        - id
        - contractId
        - action
        - actorTenantId
        - recordCount
        - fieldHash
        - createdAt
      properties:
        id:
          type: string
        contractId:
          type: string
        action:
          type: string
        actorTenantId:
          type: string
        recordCount:
          type: integer
        fieldHash:
          type: string
        createdAt:
          type: string
          format: date-time
