        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OverviewFeedResponse'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
      parameters:
        - name: days
          in: query
          schema:
            type: integer
            default: 7
        - name: limit
          in: query
          schema:
            type: integer
            default: 25
        - name: cursor
          in: query
          schema:
            type: string
        - name: agentKey
          in: query
          schema:
            type: string
        - name: risk
          in: query
          schema:
            type: string
            enum:
              - high
              - low
        - name: executionMode
          in: query
          schema:
            type: string
            enum:
              - autonomous
              - approval_required
              - inform_only
        - name: actionType
          in: query
          schema:
            type: string
            enum:
              - proactive
              - autonomous
              - goal
              - approval
        - name: module
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
            maxLength: 100
