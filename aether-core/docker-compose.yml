services:
  postgres:
    image: pgvector/pgvector:pg15
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-aether_core}
    ports:
      # Host 15432 avoids conflict with native Windows PostgreSQL (often on 5432/5433)
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - aether_internal

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - aether_internal

  kafka:
    image: bitnami/kafka:3.7
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      ALLOW_PLAINTEXT_LISTENER: "yes"
    networks:
      - aether_internal

  peer-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: sh -c "npm install && npx prisma generate && npm run peer-worker"
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql://postgres:postgres@postgres:5432/aether_core?schema=public}
      MESSAGE_BROKER: ${MESSAGE_BROKER:-none}
      KAFKA_ENABLED: ${KAFKA_ENABLED:-false}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
      EVENT_BUS_MODE: ${EVENT_BUS_MODE:-inprocess}
      OUTBOX_RELAY_OWNER: ${OUTBOX_RELAY_OWNER:-peer-worker}
      MULTI_AGENT_ASYNC_PEER: ${MULTI_AGENT_ASYNC_PEER:-false}
      MULTI_AGENT_PEER_DELEGATION: ${MULTI_AGENT_PEER_DELEGATION:-false}
      MULTI_AGENT_DELEGATION_ENABLED: ${MULTI_AGENT_DELEGATION_ENABLED:-true}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL_DOCKER:-http://ollama:11434}
      NODE_ENV: ${NODE_ENV:-development}
    depends_on:
      - postgres
      - kafka
      - ollama
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - aether_internal

  federated-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: sh -c "npm install && npx prisma generate && npm run federated-worker"
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql://postgres:postgres@postgres:5432/aether_core?schema=public}
      MESSAGE_BROKER: ${MESSAGE_BROKER:-none}
      KAFKA_ENABLED: ${KAFKA_ENABLED:-false}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
      FEDERATED_RPC_ENABLED: ${FEDERATED_RPC_ENABLED:-false}
      FEDERATED_DEPLOYMENT_ID: ${FEDERATED_DEPLOYMENT_ID:-local}
      FEDERATED_SIGNING_SECRET: ${FEDERATED_SIGNING_SECRET:-dev-federated-secret-change-me}
      OUTBOX_RELAY_OWNER: ${OUTBOX_RELAY_OWNER:-federated-worker}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL_DOCKER:-http://ollama:11434}
      NODE_ENV: ${NODE_ENV:-development}
    depends_on:
      - postgres
      - kafka
      - ollama
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - aether_internal

  jaeger:
    image: jaegertracing/all-in-one:1.57
    restart: unless-stopped
    ports:
      - "4318:4318"
      - "16686:16686"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks:
      - aether_internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: sh -c "npm install && npx prisma generate && npm run dev"
    ports:
      - "9000:9000"
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql://postgres:postgres@postgres:5432/aether_core?schema=public}
      AETHER_API_KEY: ${AETHER_API_KEY}
      AETHER_DEFAULT_TENANT: ${AETHER_DEFAULT_TENANT:-tenant_default}
      HIVE_MIND_SALT: ${HIVE_MIND_SALT}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL_DOCKER:-http://ollama:11434}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      INTELLIGENCE_EMBEDDING: ${INTELLIGENCE_EMBEDDING:-ollama}
      INTELLIGENCE_VECTOR_BACKEND: ${INTELLIGENCE_VECTOR_BACKEND:-pgvector}
      INTELLIGENCE_KNOWLEDGE_TRANSFER_ENABLED: ${INTELLIGENCE_KNOWLEDGE_TRANSFER_ENABLED:-false}
      LANCE_DB_PATH: ${LANCE_DB_PATH:-/data/brain-lance}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      MESSAGE_BROKER: ${MESSAGE_BROKER:-none}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
      EVENT_BUS_MODE: ${EVENT_BUS_MODE:-inprocess}
      OUTBOX_RELAY_OWNER: ${OUTBOX_RELAY_OWNER:-api}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318/v1/traces}
      SUPPLIER_WORKER_URL: ${SUPPLIER_WORKER_URL:-http://supplier-worker:8090}
      NODE_ENV: ${NODE_ENV:-development}
    depends_on:
      - postgres
      - redis
      - jaeger
      - supplier-worker
      - ollama
    volumes:
      - ./docs:/docs:ro
      - ./backend:/app
      - /app/node_modules
    networks:
      - aether_internal

  supplier-worker:
    image: node:20-alpine
    restart: unless-stopped
    working_dir: /app
    command: node scripts/supplier-worker-server.mjs
    ports:
      - "8090:8090"
    environment:
      SUPPLIER_WORKER_PORT: "8090"
      SUPPLIER_ALLOWLIST: ${SUPPLIER_ALLOWLIST:-example.com}
    volumes:
      - .:/app
    networks:
      - aether_internal

  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      - ollama
    entrypoint: ["/bin/sh", "-c", "sleep 5 && OLLAMA_HOST=http://ollama:11434 ollama pull nomic-embed-text && OLLAMA_HOST=http://ollama:11434 ollama pull llama3.2"]
    networks:
      - aether_internal

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    # Internal-only: backend reaches ollama via http://ollama:11434 — no host port publish
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - aether_internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:9000}
      VITE_AETHER_API_KEY: ${VITE_AETHER_API_KEY}
      VITE_AETHER_TENANT: ${VITE_AETHER_TENANT:-tenant_default}
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - aether_internal

networks:
  aether_internal:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  ollama_data:
